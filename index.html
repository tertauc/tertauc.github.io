<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="淂纛羙秹">
<meta name="author" content="淂纛羙秹">
<title>淂纛羙秹</title>
<meta id="meta-theme-color" name="theme-color" content="#ffffff">
<link rel="icon" href="assets/avatar.png" type="image/png">
<script>
  /* 首帧绘制前确定主题，避免深浅色切换时闪烁（FOUC） */
  (function () {
    var KEY = 'theme-preference';
    var mode = 'auto';
    try {
      var saved = localStorage.getItem(KEY);
      if (saved === 'light' || saved === 'dark' || saved === 'auto') mode = saved;
    } catch (e) {}
    var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    var dark = mode === 'dark' || (mode === 'auto' && prefersDark);
    var root = document.documentElement;
    root.setAttribute('data-theme', dark ? 'dark' : 'light');
    root.setAttribute('data-theme-mode', mode);
    root.classList.add('js');
  })();
</script>
<link rel="stylesheet" href="assets/styles.css">
</head>
<body>
<a class="skip-link" href="#main">跳到主要内容</a>

<header class="site-header">
  <div class="wrap header-inner">
    <a class="brand" href="#top" aria-label="淂纛羙秹 首页">
      <img class="brand-avatar" src="assets/avatar.png" alt="" width="30" height="30">
      <span class="brand-name">淂纛羙秹</span>
    </a>

    <!-- 主题切换：自动 → 浅色 → 深色 循环 -->
    <button id="theme-toggle" class="theme-toggle" type="button" aria-label="切换主题">
      <svg class="theme-icon" data-mode="auto" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <rect x="2.5" y="4" width="19" height="13" rx="2.5"/>
        <path d="M8.5 20.5h7M12 17v3.5"/>
      </svg>
      <svg class="theme-icon" data-mode="light" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <circle cx="12" cy="12" r="4.2"/>
        <path d="M12 2.6v2.2M12 19.2v2.2M4.4 4.4l1.6 1.6M18 18l1.6 1.6M2.6 12h2.2M19.2 12h2.2M4.4 19.6 6 18M18 6l1.6-1.6"/>
      </svg>
      <svg class="theme-icon" data-mode="dark" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <path d="M20.5 14.2A8.5 8.5 0 0 1 9.8 3.5a8.5 8.5 0 1 0 10.7 10.7Z"/>
      </svg>
    </button>
  </div>
</header>

<main id="main">
  <!-- 名字与头像 -->
  <section class="hero" id="top">
    <div class="wrap hero-inner">
      <div class="hero-avatar">
        <img src="assets/avatar.png" alt="淂纛羙秹 的头像" width="128" height="128">
      </div>
      <h1 class="hero-name">淂纛羙秹</h1>
    </div>
  </section>

  <div class="wrap">
    <!-- 神秘服务器神人语录入口 -->
    <section class="feature reveal" aria-labelledby="quotes-entry-title">
      <button class="feature-card" id="quotes-entry" type="button" aria-haspopup="dialog">
        <span class="feature-icon" aria-hidden="true">
          <img src="assets/shiguangge.png" alt="" width="58" height="58">
        </span>
        <span class="feature-text">
          <span class="feature-title" id="quotes-entry-title">拾光阁神人语录</span>
          <span class="feature-sub">收录了拾光阁的经典名言</span>
        </span>
        <span class="feature-cta" aria-hidden="true">
          <span>查看</span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <path d="M5 12h13M13 6.5 18.5 12 13 17.5"/>
          </svg>
        </span>
        <span class="feature-mark" aria-hidden="true">”</span>
      </button>
    </section>

    <!-- 项目 -->
    <section class="section reveal" id="projects" aria-labelledby="projects-title">
      <h2 class="section-title" id="projects-title">项目</h2>
      <div class="project-grid">
        <button class="project" type="button" data-project="Ender Ring Restorer">
          <span class="project-head">
            <span class="project-icon" aria-hidden="true">
              <img src="assets/icon.png" alt="" width="42" height="42">
            </span>
            <span class="project-title">Ender Ring Restorer</span>
            <svg class="project-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M7 17 17 7M9 7h8v8"/>
            </svg>
          </span>
          <span class="project-desc">在 mc26.3+ 中恢复末地环状地形生成。</span>
          <span class="project-tags">
            <span class="tag">Minecraft</span>
            <span class="tag">模组</span>
          </span>
        </button>

        <button class="project" type="button" data-project="Gunmu">
          <span class="project-head">
            <span class="project-icon" aria-hidden="true">
              <img src="assets/pack.png" alt="" width="42" height="42">
            </span>
            <span class="project-title">Gunmu</span>
            <svg class="project-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M7 17 17 7M9 7h8v8"/>
            </svg>
          </span>
          <span class="project-desc">将 mc 中所有原版资源替换成滚木。</span>
          <span class="project-tags">
            <span class="tag">Minecraft</span>
            <span class="tag">资源包</span>
          </span>
        </button>
      </div>
    </section>
  </div>
</main>

<footer class="site-footer">
  <div class="wrap footer-inner">
    <p>© <span id="year">2026</span> 淂纛羙秹</p>
  </div>
</footer>

<!-- 语录全屏界面 -->
<div class="quotes-view" id="quotes-view" role="dialog" aria-modal="true" aria-labelledby="quotes-title" aria-hidden="true">
  <div class="quotes-bar">
    <div class="wrap quotes-bar-inner">
      <button class="icon-btn" id="quotes-close" type="button" aria-label="关闭语录">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/>
        </svg>
      </button>
      <div class="quotes-heading">
        <h2 id="quotes-title">拾光阁神人语录</h2>
        <p class="quotes-sub">点击任意一条放大查看</p>
      </div>
    </div>
  </div>

  <div class="quotes-body" id="quotes-body">
    <div class="wrap">
      <!-- 经典总结 -->
      <section class="classics" aria-labelledby="classics-title">
        <h3 class="classics-title" id="classics-title">经典总结</h3>
        <div class="classics-grid" id="classics-grid"></div>
        <a class="qq-join" href="mqqapi://card/show_pslcard?src_type=internal&amp;version=1&amp;uin=779100915&amp;card_type=group&amp;source=qrcode" aria-label="加入 QQ 群 779100915">
          <span class="qq-join-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20.5 12.4c0 4.1-3.8 7.4-8.5 7.4-1 0-2-.15-2.9-.43l-4.1 1.13 1.1-3.6c-1.3-1.24-2.1-2.88-2.1-4.67 0-4.09 3.8-7.4 8.5-7.4s8.5 3.31 8.5 7.57Z"/>
              <path d="M8.8 12.6h.01M12 12.6h.01M15.2 12.6h.01"/>
            </svg>
          </span>
          <span class="qq-join-body">
            <span class="qq-join-title">一键加入 QQ 群</span>
            <span class="qq-join-sub">群号 779100915 · 一起感受神人语录</span>
          </span>
          <svg class="qq-join-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M7 17 17 7M9 7h8v8"/>
          </svg>
        </a>
      </section>

      <div class="quotes-grid" id="quotes-grid"></div>
    </div>
  </div>
</div>

<!-- 单条语录放大 -->
<div class="quote-detail" id="quote-detail" role="dialog" aria-modal="true" aria-label="语录详情" aria-hidden="true">
  <div class="quote-detail-card" id="quote-detail-card">
    <button class="icon-btn quote-detail-close" id="quote-detail-close" type="button" aria-label="关闭">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/>
      </svg>
    </button>
    <p class="quote-detail-label" id="quote-detail-label" hidden></p>
    <svg class="quote-detail-mark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M9.5 6.5C7 7.6 5.6 9.7 5.6 12.2v4.3h4.6v-4.6H7.9c0-1.7.9-3 2.5-3.9l-.9-1.5Z"/>
      <path d="M18 6.5c-2.5 1.1-3.9 3.2-3.9 5.7v4.3h4.6v-4.6h-2.3c0-1.7.9-3 2.5-3.9L18 6.5Z"/>
    </svg>
    <p class="quote-detail-text" id="quote-detail-text"></p>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="assets/main.js" defer></script>
</body>
</html>

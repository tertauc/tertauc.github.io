<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="淂纛羙秹的个人网站">
<meta name="author" content="淂纛羙秹">
<title>淂纛羙秹</title>
<meta id="meta-theme-color" name="theme-color" content="#ffffff">
<link rel="icon" href="assets/images/avatar.png" type="image/png">
<script>
  /* 首帧绘制前确定主题，避免深浅色切换时闪烁（FOUC） */
  (function () {
    var KEY = 'theme-preference';
    var mode = 'auto';
    try {
      var saved = localStorage.getItem(KEY);
      if (saved === 'light' || saved === 'dark' || saved === 'auto') mode = saved;
    } catch (e) {}
    var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    var dark = mode === 'dark' || (mode === 'auto' && prefersDark);
    var root = document.documentElement;
    root.setAttribute('data-theme', dark ? 'dark' : 'light');
    root.setAttribute('data-theme-mode', mode);
    root.classList.add('js');
  })();
</script>
<link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
<a class="skip-link" href="#main">跳到主要内容</a>

<header class="site-header">
  <div class="wrap header-inner">
    <a class="brand" href="./" aria-label="淂纛羙秹 首页">
      <img class="brand-avatar" src="assets/images/avatar.png" alt="" width="20" height="20">
      <span class="brand-name">淂纛羙秹</span>
    </a>

    <nav class="nav-links" aria-label="站点导航">
      <a href="projects/">项目</a>
      <a href="time/">时间</a>
      <button id="theme-toggle" class="theme-toggle" type="button" aria-label="切换主题">
        <svg class="theme-icon" data-mode="auto" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <rect x="2.5" y="4" width="19" height="13" rx="2.5"/>
          <path d="M8.5 20.5h7M12 17v3.5"/>
        </svg>
        <svg class="theme-icon" data-mode="light" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <circle cx="12" cy="12" r="4.2"/>
          <path d="M12 2.6v2.2M12 19.2v2.2M4.4 4.4l1.6 1.6M18 18l1.6 1.6M2.6 12h2.2M19.2 12h2.2M4.4 19.6 6 18M18 6l1.6-1.6"/>
        </svg>
        <svg class="theme-icon" data-mode="dark" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path d="M20.5 14.2A8.5 8.5 0 0 1 9.8 3.5a8.5 8.5 0 1 0 10.7 10.7Z"/>
        </svg>
      </button>
    </nav>
  </div>
</header>

<main id="main">
  <!-- 首屏 -->
  <section class="tile tile--light home-hero">
    <div class="wrap home-hero-inner">
      <img class="home-avatar" src="assets/images/avatar.png" alt="淂纛羙秹 的头像" width="96" height="96">
      <h1 class="home-name">淂纛羙秹</h1>
      <div class="home-actions">
        <a class="btn btn--primary" href="projects/">查看项目</a>
        <a class="btn btn--secondary" href="time/">全屏时间</a>
      </div>
    </div>
  </section>

  <!-- 项目 -->
  <section class="tile tile--parchment" id="projects" aria-labelledby="projects-title">
    <div class="wrap reveal">
      <h2 class="section-title" id="projects-title">项目</h2>

      <a class="entry" href="projects/">
        <span class="entry-icons" aria-hidden="true">
          <img src="assets/images/icon.png" alt="" width="56" height="56">
          <img src="assets/images/pack.png" alt="" width="56" height="56">
          <img src="assets/images/nrel.svg" alt="" width="56" height="56">
        </span>
        <span class="entry-body">
          <span class="entry-title">全部项目</span>
        </span>
        <span class="entry-action" aria-hidden="true">查看全部 →</span>
      </a>
    </div>
  </section>

  <!-- 工具 -->
  <section class="tile tile--dark" id="tools" aria-labelledby="tools-title">
    <div class="wrap reveal">
      <h2 class="section-title" id="tools-title">工具</h2>
      <p class="tile-lead">全屏时间</p>
      <p style="margin-top: 28px;">
        <a class="btn btn--primary" href="time/">打开</a>
      </p>
    </div>
  </section>
</main>

<footer class="site-footer">
  <div class="wrap footer-inner">
    <p>© <span id="year">2026</span> 淂纛羙秹</p>
    <nav class="footer-links" aria-label="页脚导航">
      <a href="./">首页</a>
      <a href="projects/">项目</a>
      <a href="time/">时间</a>
    </nav>
  </div>
</footer>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="assets/js/main.js" defer></script>
</body>
</html>

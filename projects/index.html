<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="淂纛羙秹的项目：Ender Ring Restorer、Gunmu、NREL。">
<meta name="author" content="淂纛羙秹">
<title>项目 · 淂纛羙秹</title>
<meta id="meta-theme-color" name="theme-color" content="#ffffff">
<link rel="icon" href="../assets/images/avatar.png" type="image/png">
<script>
  /* 首帧绘制前确定主题与项目视图，避免闪烁 */
  (function () {
    var KEY = 'theme-preference';
    var mode = 'auto';
    try {
      var saved = localStorage.getItem(KEY);
      if (saved === 'light' || saved === 'dark' || saved === 'auto') mode = saved;
    } catch (e) {}
    var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    var dark = mode === 'dark' || (mode === 'auto' && prefersDark);
    var root = document.documentElement;
    root.setAttribute('data-theme', dark ? 'dark' : 'light');
    root.setAttribute('data-theme-mode', mode);

    var view = 'grid';
    try {
      var savedView = localStorage.getItem('projects-view');
      if (savedView === 'list' || savedView === 'grid') view = savedView;
    } catch (e) {}
    root.setAttribute('data-projects-view', view);
    root.classList.add('js');
  })();
</script>
<link rel="stylesheet" href="../assets/css/styles.css">
<style>
  /* =========================================================
     项目总览页局部样式（继承全站主题变量）
     ========================================================= */

  .projects-hero { padding: 40px 0 4px; }

  .projects-head {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 18px;
  }
  .projects-head-text h1 {
    font-size: clamp(2.1rem, 5vw, 2.9rem);
    font-weight: 800;
    letter-spacing: -0.03em;
  }
  .projects-head-text p {
    margin-top: 6px;
    font-size: 0.98rem;
    color: var(--text-muted);
  }

  /* ---------- 视图切换 ---------- */
  .view-switch {
    display: inline-flex;
    gap: 2px;
    padding: 4px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 999px;
  }
  .view-btn {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 8px 16px;
    font: inherit;
    font-size: 0.86rem;
    font-weight: 600;
    color: var(--text-muted);
    background: transparent;
    border: 0;
    border-radius: 999px;
    cursor: pointer;
    transition: color 0.2s ease, background-color 0.2s ease, box-shadow 0.2s ease;
  }
  .view-btn svg { width: 16px; height: 16px; }
  .view-btn:hover { color: var(--text); }
  .view-btn.is-active {
    color: var(--text);
    background: var(--surface);
    box-shadow: var(--shadow);
  }

  /* ---------- 项目列表 ---------- */
  .projects-grid {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 18px;
  }

  .pcard {
    display: grid;
    grid-template-columns: 46px minmax(0, 1fr) 18px;
    grid-template-areas:
      "icon title arrow"
      "desc desc desc"
      "tags tags tags";
    align-items: center;
    gap: 12px 14px;
    padding: 24px;
    color: var(--text);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    transition: transform 0.22s ease, box-shadow 0.22s ease,
      border-color 0.22s ease, background-color 0.3s ease;
  }
  .pcard:hover {
    text-decoration: none;
    transform: translateY(-3px);
    border-color: color-mix(in srgb, var(--accent) 45%, var(--border));
    box-shadow: var(--shadow-hover);
  }

  .pcard-icon {
    grid-area: icon;
    width: 46px;
    height: 46px;
    border-radius: 12px;
    overflow: hidden;
    background: var(--accent-soft);
  }
  .pcard-icon img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .pcard-title {
    grid-area: title;
    font-size: 1.08rem;
    font-weight: 700;
  }

  .pcard-desc {
    grid-area: desc;
    align-self: start;
    font-size: 0.94rem;
    color: var(--text-muted);
  }

  .pcard-tags {
    grid-area: tags;
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    justify-self: start;
  }

  .pcard-arrow {
    grid-area: arrow;
    width: 18px;
    height: 18px;
    justify-self: end;
    color: var(--text-muted);
    transition: color 0.2s ease, transform 0.2s ease;
  }
  .pcard:hover .pcard-arrow {
    color: var(--accent);
    transform: translate(2px, -2px);
  }

  /* ---------- 列表视图 ---------- */
  html[data-projects-view="list"] .projects-grid {
    grid-template-columns: minmax(0, 1fr);
    gap: 12px;
  }
  html[data-projects-view="list"] .pcard {
    grid-template-columns: 46px minmax(110px, 0.85fr) minmax(0, 1.5fr) auto 18px;
    grid-template-areas: "icon title desc tags arrow";
    gap: 14px 18px;
    padding: 16px 22px;
  }
  html[data-projects-view="list"] .pcard-desc {
    align-self: center;
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
  }
  html[data-projects-view="list"] .pcard-tags {
    flex-wrap: nowrap;
    justify-self: end;
  }

  /* ---------- 响应式 ---------- */
  @media (max-width: 860px) {
    .projects-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  }

  @media (max-width: 780px) {
    html[data-projects-view="list"] .pcard {
      grid-template-columns: 46px minmax(0, 1fr) 18px;
      grid-template-areas:
        "icon title arrow"
        "desc desc desc"
        "tags tags tags";
      gap: 12px 14px;
      padding: 20px;
    }
    html[data-projects-view="list"] .pcard-desc {
      align-self: start;
      overflow: visible;
      white-space: normal;
      text-overflow: clip;
    }
    html[data-projects-view="list"] .pcard-tags {
      flex-wrap: wrap;
      justify-self: start;
    }
  }

  @media (max-width: 600px) {
    .projects-hero { padding: 28px 0 0; }
    .projects-grid { grid-template-columns: minmax(0, 1fr); gap: 12px; }
    .pcard { padding: 18px 20px; }
    .view-switch { padding: 3px; }
    .view-btn { padding: 7px 13px; font-size: 0.83rem; }
    .view-btn svg { width: 15px; height: 15px; }
  }
</style>
</head>
<body>
<a class="skip-link" href="#main">跳到主要内容</a>

      <span class="brand-name">淂纛羙秹</span>

    <!-- 主题切换：自动 → 浅色 → 深色 循环 -->
    <button id="theme-toggle" class="theme-toggle" type="button" aria-label="切换主题">
      <svg class="theme-icon" data-mode="auto" viewBox="0 0 24 24" aria-hidden="true" focusable="false">

      </svg>
      <svg class="theme-icon" data-mode="light" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <circle cx="12" cy="12" r="4.2"/>
        <path d="M12 2.6v2.2M12 19.2v2.2M4.4 4.4l1.6 1.6M18 18l1.6 1.6M2.6 12h2.2M19.2 12h2.2M4.4 19.6 6 18M18 6l1.6-1.6"/>
      </svg>
      <svg class="theme-icon" data-mode="dark" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <path d="M20.5 14.2A8.5 8.5 0 0 1 9.8 3.5a8.5 8.5 0 1 0 10.7 10.7Z"/>
      </svg>
    </button>
  </div>
</header>

  <div class="wrap">
    <section class="projects-hero">
      <a class="back-link" href="../">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M19 12H5M11 18l-6-6 6-6"/>
        </svg>
        返回首页
      </a>

      <div class="projects-head">
        <div class="projects-head-text">
          <h1>项目</h1>
        </div>

        <div class="view-switch" role="group" aria-label="切换项目视图">
          <button class="view-btn" type="button" data-view-btn="grid" aria-pressed="true" title="卡片视图（一行 3 个）">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="3.5" y="3.5" width="7" height="7" rx="1.6"/>
              <rect x="13.5" y="3.5" width="7" height="7" rx="1.6"/>

              <path d="M8 6h12M8 12h12M8 18h12"/>
              <circle cx="4.2" cy="6" r="1.1" fill="currentColor" stroke="none"/>

              <circle cx="4.2" cy="18" r="1.1" fill="currentColor" stroke="none"/>

          </button>

    <section class="section reveal" aria-label="项目列表">

          <span class="pcard-tags">

</main>

<footer class="site-footer">
  <div class="wrap footer-inner">
    <p>© <span id="year">2026</span> 淂纛羙秹</p>
  </div>
</footer>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="../assets/js/main.js" defer></script>
<script>
  /* 项目视图：卡片 / 列表，选择持久化 */
  (function () {
    var root = document.documentElement;
    var KEY = 'projects-view';
    var buttons = document.querySelectorAll('[data-view-btn]');
    if (!buttons.length) return;

    function apply(view) {
      root.setAttribute('data-projects-view', view);
      Array.prototype.forEach.call(buttons, function (btn) {
        var active = btn.getAttribute('data-view-btn') === view;
        btn.classList.toggle('is-active', active);
        btn.setAttribute('aria-pressed', active ? 'true' : 'false');
      });
    }

    Array.prototype.forEach.call(buttons, function (btn) {
      btn.addEventListener('click', function () {
        var view = btn.getAttribute('data-view-btn');
        try { localStorage.setItem(KEY, view); } catch (e) {}
        apply(view);
      });
    });

    apply(root.getAttribute('data-projects-view') || 'grid');
  })();
</script>
</body>
</html>

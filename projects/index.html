<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="淂纛羙秹的项目：Ender Ring Restorer、Gunmu、NREL。">
<meta name="author" content="淂纛羙秹">
<title>项目 · 淂纛羙秹</title>
<meta id="meta-theme-color" name="theme-color" content="#ffffff">
<link rel="icon" href="../assets/images/avatar.png" type="image/png">
<script>
  /* 首帧绘制前确定主题与项目视图，避免闪烁 */
  (function () {
    var KEY = 'theme-preference';
    var mode = 'auto';
    try {
      var saved = localStorage.getItem(KEY);
      if (saved === 'light' || saved === 'dark' || saved === 'auto') mode = saved;
    } catch (e) {}
    var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    var dark = mode === 'dark' || (mode === 'auto' && prefersDark);
    var root = document.documentElement;
    root.setAttribute('data-theme', dark ? 'dark' : 'light');
    root.setAttribute('data-theme-mode', mode);

    var view = 'grid';
    try {
      var savedView = localStorage.getItem('projects-view');
      if (savedView === 'list' || savedView === 'grid') view = savedView;
    } catch (e) {}
    root.setAttribute('data-projects-view', view);
    root.classList.add('js');
  })();
</script>
<link rel="stylesheet" href="../assets/css/styles.css">
<style>
  /* =========================================================
     项目总览页局部样式
     ========================================================= */
  .projects-hero {
    padding: 80px 0 48px;
  }

  /* ---------- 磨砂子导航 ---------- */
  .subnav {
    position: sticky;
    top: 44px;
    z-index: 50;
    height: 52px;
    background: color-mix(in srgb, var(--parchment) 80%, transparent);
    backdrop-filter: saturate(180%) blur(20px);
    -webkit-backdrop-filter: saturate(180%) blur(20px);
    border-bottom: 1px solid color-mix(in srgb, var(--ink) 8%, transparent);
  }

  .subnav-inner {
    height: 52px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
  }

  .subnav-title {
    font-family: var(--font-display);
    font-size: 21px;
    font-weight: 600;
    letter-spacing: 0.231px;
  }

  /* ---------- 视图切换 ---------- */
  .view-switch {
    display: inline-flex;
    gap: 2px;
    padding: 2px;
    background: color-mix(in srgb, var(--ink) 6%, transparent);
    border-radius: 9999px;
  }

  .view-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 7px 14px;
    font-family: var(--font-text);
    font-size: 12px;
    letter-spacing: -0.12px;
    color: var(--muted);
    background: transparent;
    border: 0;
    border-radius: 9999px;
    cursor: pointer;
    transition: background-color 0.2s ease, color 0.2s ease;
  }
  .view-btn svg { width: 14px; height: 14px; }
  .view-btn:hover { color: var(--ink); }
  .view-btn.is-active {
    color: var(--accent);
    background: var(--canvas);
  }
  .view-btn:active { transform: scale(0.95); }

  /* ---------- 项目网格 ---------- */
  .projects-grid {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 24px;
  }

  .pcard {
    display: grid;
    grid-template-columns: 64px minmax(0, 1fr) 18px;
    grid-template-areas:
      "icon title arrow"
      "tags tags tags";
    align-items: center;
    gap: 16px;
    padding: 24px;
    color: var(--ink);
    background: var(--canvas);
    border: 1px solid var(--hairline);
    border-radius: 18px;
    transition: background-color 0.2s ease;
  }
  .pcard:hover { background: var(--pearl); }

  .pcard-icon {
    grid-area: icon;
    width: 64px;
    height: 64px;
    border-radius: 8px;
    box-shadow: var(--product-shadow);
  }
  .pcard-icon img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: 8px;
  }

  .pcard-title {
    grid-area: title;
    font-family: var(--font-display);
    font-size: 17px;
    font-weight: 600;
    letter-spacing: -0.374px;
    line-height: 1.24;
  }

  .pcard-tags {
    grid-area: tags;
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    justify-self: start;
  }

  .pcard-arrow {
    grid-area: arrow;
    width: 16px;
    height: 16px;
    justify-self: end;
    color: var(--accent);
  }

  /* ---------- 列表视图 ---------- */
  html[data-projects-view="list"] .projects-grid {
    grid-template-columns: minmax(0, 1fr);
    gap: 12px;
  }
  html[data-projects-view="list"] .pcard {
    grid-template-columns: 48px minmax(0, 1fr) auto 18px;
    grid-template-areas: "icon title tags arrow";
    gap: 14px 20px;
    padding: 16px 24px;
  }
  html[data-projects-view="list"] .pcard-icon {
    width: 48px;
    height: 48px;
  }
  html[data-projects-view="list"] .pcard-tags {
    flex-wrap: nowrap;
    justify-self: end;
  }

  /* ---------- 响应式 ---------- */
  @media (max-width: 1068px) {
    .projects-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  }

  @media (max-width: 833px) {
    .projects-hero { padding: 64px 0 40px; }
    html[data-projects-view="list"] .pcard {
      grid-template-columns: 40px minmax(0, 1fr) auto 18px;
      grid-template-areas: "icon title tags arrow";
      gap: 12px;
      padding: 16px 20px;
    }
    html[data-projects-view="list"] .pcard-icon { width: 40px; height: 40px; }
    html[data-projects-view="list"] .pcard-tags {
      flex-wrap: nowrap;
      justify-self: end;
    }
  }

  @media (max-width: 640px) {
    .projects-hero { padding: 48px 0 32px; }
    .projects-grid { grid-template-columns: minmax(0, 1fr); gap: 12px; }
    .pcard { padding: 20px; }
    .subnav-title { font-size: 17px; letter-spacing: -0.374px; }
    .view-btn { padding: 6px 11px; }
  }
</style>
</head>

<script>
  /* 项目视图：卡片 / 列表，选择持久化 */
  (function () {
    var root = document.documentElement;
    var KEY = 'projects-view';
    var buttons = document.querySelectorAll('[data-view-btn]');
    if (!buttons.length) return;

    function apply(view) {
      root.setAttribute('data-projects-view', view);
      Array.prototype.forEach.call(buttons, function (btn) {
        var active = btn.getAttribute('data-view-btn') === view;
        btn.classList.toggle('is-active', active);
        btn.setAttribute('aria-pressed', active ? 'true' : 'false');
      });
    }

    Array.prototype.forEach.call(buttons, function (btn) {
      btn.addEventListener('click', function () {
        var view = btn.getAttribute('data-view-btn');
        try { localStorage.setItem(KEY, view); } catch (e) {}
        apply(view);
      });
    });

    apply(root.getAttribute('data-projects-view') || 'grid');
  })();
</script>

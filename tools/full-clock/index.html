<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="全屏时钟：当前时间、公历日期与农历日期。">
<meta name="author" content="淂纛羙秹">
<title>全屏时钟 · 淂纛羙秹</title>
<meta id="meta-theme-color" name="theme-color" content="#ffffff">
<link rel="icon" href="../../assets/images/avatar.png" type="image/png">
<script>
  /* 首帧绘制前确定主题，避免深浅色切换时闪烁（FOUC） */
  (function () {
    var KEY = 'theme-preference';
    var mode = 'auto';
    try {
      var saved = localStorage.getItem(KEY);
      if (saved === 'light' || saved === 'dark' || saved === 'auto') mode = saved;
    } catch (e) {}
    var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    var dark = mode === 'dark' || (mode === 'auto' && prefersDark);
    var root = document.documentElement;
    root.setAttribute('data-theme', dark ? 'dark' : 'light');
    root.setAttribute('data-theme-mode', mode);
    root.classList.add('js');
  })();
</script>
<link rel="stylesheet" href="../../assets/css/styles.css">
<style>
  /* =========================================================
     时间页：屏幕正中央的超大时钟
     ========================================================= */
  html,
  body {
    height: 100%;
  }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI",
      "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  }

  .time-stage {
    position: fixed;
    inset: var(--header-h) 0 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 20px;
    padding: 24px;
    text-align: center;
    pointer-events: none;
  }
  .time-stage::before {
    content: "";
    position: absolute;
    inset: -15%;
    background: radial-gradient(42% 42% at 50% 46%, var(--accent-soft), transparent 72%);
    pointer-events: none;
  }
  .clock {
    position: relative;
    display: flex;
    align-items: baseline;
    justify-content: center;
    font-family: "SF Pro Display", system-ui, -apple-system, "PingFang SC",
      "Microsoft YaHei", sans-serif;
    font-size: clamp(3.6rem, 22vw, 26rem);
    font-weight: 700;
    line-height: 1;
    letter-spacing: -0.035em;
    font-variant-numeric: tabular-nums;
    font-feature-settings: "tnum" 1;
    user-select: none;
    -webkit-user-select: none;
  }
  .clock .colon {
    margin: 0 0.02em;
    transform: translateY(-0.06em);
    animation: colon-pulse 2s ease-in-out infinite;
  }
  @keyframes colon-pulse {
    0%, 45%, 100% { opacity: 1; }
    55%, 95% { opacity: 0.28; }
  }

  .date-line {
    position: relative;
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
      "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    font-size: clamp(0.78rem, 1.5vw, 0.98rem);
    letter-spacing: 0.14em;
    color: var(--text-muted);
    font-variant-numeric: tabular-nums;
    user-select: none;
    -webkit-user-select: none;
  }

  /* ---------- 返回首页：与其他页面同一位置 ---------- */
  .clock-back {
    position: relative;
    z-index: 2;
    padding-top: 40px;
  }

  @media (prefers-reduced-motion: reduce) {
    .clock .colon { animation: none; }
  }

  @media (max-width: 600px) {
    .time-stage { gap: 14px; padding: 20px; }
    .clock-back { padding-top: 28px; }
    .date-line { letter-spacing: 0.08em; }
  }
</style>
</head>
<body>
<header class="site-header">
  <div class="wrap header-inner">
    <a class="brand" href="../../" aria-label="淂纛羙秹 首页">
      <img class="brand-avatar" src="../../assets/images/avatar.png" alt="" width="30" height="30">
      <span class="brand-name">淂纛羙秹</span>
    </a>

    <!-- 主题切换：自动 → 浅色 → 深色 循环 -->
    <button id="theme-toggle" class="theme-toggle" type="button" aria-label="切换主题">
      <svg class="theme-icon" data-mode="auto" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <rect x="2.5" y="4" width="19" height="13" rx="2.5"/>
        <path d="M8.5 20.5h7M12 17v3.5"/>
      </svg>
      <svg class="theme-icon" data-mode="light" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <circle cx="12" cy="12" r="4.2"/>
        <path d="M12 2.6v2.2M12 19.2v2.2M4.4 4.4l1.6 1.6M18 18l1.6 1.6M2.6 12h2.2M19.2 12h2.2M4.4 19.6 6 18M18 6l1.6-1.6"/>
      </svg>
      <svg class="theme-icon" data-mode="dark" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <path d="M20.5 14.2A8.5 8.5 0 0 1 9.8 3.5a8.5 8.5 0 1 0 10.7 10.7Z"/>
      </svg>
    </button>
  </div>
</header>

<div class="wrap clock-back">
  <a class="back-link" href="../../">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M19 12H6M11 5.5 4.5 12l6.5 6.5"/>
    </svg>
    <span>返回首页</span>
  </a>
</div>

<div class="time-stage">
  <div class="clock" id="clock" role="timer" aria-live="off">
    <span id="clock-h">--</span><span class="colon">:</span><span id="clock-m">--</span><span class="colon">:</span><span id="clock-s">--</span>
  </div>
  <p class="date-line" id="date-line">正在读取日期…</p>
</div>

<script src="../../assets/js/main.js" defer></script>
<script>
  /* =========================================================
     时钟：优先使用网络时间 API 校准，失败时回退系统时间
     ========================================================= */
  (function () {
    'use strict';

    var clockH = document.getElementById('clock-h');
    var clockM = document.getElementById('clock-m');
    var clockS = document.getElementById('clock-s');
    var dateLine = document.getElementById('date-line');
    if (!clockH) return;

    var clockOffset = 0;   // 服务器时间 - 本机时间
    var lastSecond = -1;
    var WEEKDAYS = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];

    function pad2(n) { return n < 10 ? '0' + n : String(n); }

    /* ---------------- 农历 ---------------- */
    var LUNAR_INFO = [
      0x04bd8, 0x04ae0, 0x0a570, 0x054d5, 0x0d260, 0x0d950, 0x16554, 0x056a0, 0x09ad0, 0x055d2,
      0x04ae0, 0x0a5b6, 0x0a4d0, 0x0d250, 0x1d255, 0x0b540, 0x0d6a0, 0x0ada2, 0x095b0, 0x14977,
      0x04970, 0x0a4b0, 0x0b4b5, 0x06a50, 0x06d40, 0x1ab54, 0x02b60, 0x09570, 0x052f2, 0x04970,
      0x06566, 0x0d4a0, 0x0ea50, 0x06e95, 0x05ad0, 0x02b60, 0x186e3, 0x092e0, 0x1c8d7, 0x0c950,
      0x0d4a0, 0x1d8a6, 0x0b550, 0x056a0, 0x1a5b4, 0x025d0, 0x092d0, 0x0d2b2, 0x0a950, 0x0b557,
      0x06ca0, 0x0b550, 0x15355, 0x04da0, 0x0a5b0, 0x14573, 0x052b0, 0x0a9a8, 0x0e950, 0x06aa0,
      0x0aea6, 0x0ab50, 0x04b60, 0x0aae4, 0x0a570, 0x05260, 0x0f263, 0x0d950, 0x05b57, 0x056a0,
      0x096d0, 0x04dd5, 0x04ad0, 0x0a4d0, 0x0d4d4, 0x0d250, 0x0d558, 0x0b540, 0x0b6a0, 0x195a6,
      0x095b0, 0x049b0, 0x0a974, 0x0a4b0, 0x0b27a, 0x06a50, 0x06d40, 0x0af46, 0x0ab60, 0x09570,
      0x04af5, 0x04970, 0x064b0, 0x074a3, 0x0ea50, 0x06b58, 0x055c0, 0x0ab60, 0x096d5, 0x092e0,
      0x0c960, 0x0d954, 0x0d4a0, 0x0da50, 0x07552, 0x056a0, 0x0abb7, 0x025d0, 0x092d0, 0x0cab5,
      0x0a950, 0x0b4a0, 0x0baa4, 0x0ad50, 0x055d9, 0x04ba0, 0x0a5b0, 0x15176, 0x052b0, 0x0a930,
      0x07954, 0x06aa0, 0x0ad50, 0x05b52, 0x04b60, 0x0a6e6, 0x0a4e0, 0x0d260, 0x0ea65, 0x0d530,
      0x05aa0, 0x076a3, 0x096d0, 0x04afb, 0x04ad0, 0x0a4d0, 0x1d0b6, 0x0d250, 0x0d520, 0x0dd45,
      0x0b5a0, 0x056d0, 0x055b2, 0x049b0, 0x0a577, 0x0a4b0, 0x0aa50, 0x1b255, 0x06d20, 0x0ada0,
      0x14b63, 0x09370, 0x049f8, 0x04970, 0x064b0, 0x168a6, 0x0ea50, 0x06b20, 0x1a6c4, 0x0aae0,
      0x0a2e0, 0x0d2e3, 0x0c960, 0x0d557, 0x0d4a0, 0x0da50, 0x05d55, 0x056a0, 0x0a6d0, 0x055d4,
      0x052d0, 0x0a9b8, 0x0a950, 0x0b4a0, 0x0b6a6, 0x0ad50, 0x055a0, 0x0aba4, 0x0a5b0, 0x052b0,
      0x0b273, 0x06930, 0x07337, 0x06aa0, 0x0ad50, 0x14b55, 0x04b60, 0x0a570, 0x054e4, 0x0d160,
      0x0e968, 0x0d520, 0x0daa0, 0x16aa6, 0x056d0, 0x04ae0, 0x0a9d4, 0x0a2d0, 0x0d150, 0x0f252,
      0x0d520
    ];
    var LUNAR_DAYS = [
      '初一', '初二', '初三', '初四', '初五', '初六', '初七', '初八', '初九', '初十',
      '十一', '十二', '十三', '十四', '十五', '十六', '十七', '十八', '十九', '二十',
      '廿一', '廿二', '廿三', '廿四', '廿五', '廿六', '廿七', '廿八', '廿九', '三十'
    ];
    var STEMS = '甲乙丙丁戊己庚辛壬癸';
    var BRANCHES = '子丑寅卯辰巳午未申酉戌亥';
    var LUNAR_MONTHS = '正二三四五六七八九十冬腊';

    function leapMonth(y) { return LUNAR_INFO[y - 1900] & 0xf; }

    function leapDays(y) {
      if (!leapMonth(y)) return 0;
      return (LUNAR_INFO[y - 1900] & 0x10000) ? 30 : 29;
    }

    function monthDays(y, m) {
      return (LUNAR_INFO[y - 1900] & (0x10000 >> m)) ? 30 : 29;
    }

    function lYearDays(y) {
      var sum = 348;
      for (var i = 0x8000; i > 0x8; i >>= 1) {
        sum += (LUNAR_INFO[y - 1900] & i) ? 1 : 0;
      }
      return sum + leapDays(y);
    }

    function solarToLunar(y, m, d) {
      var offset = Math.floor((Date.UTC(y, m - 1, d) - Date.UTC(1900, 0, 31)) / 86400000);
      var i;
      var temp = 0;
      for (i = 1900; i <= 2100 && offset > 0; i++) {
        temp = lYearDays(i);
        offset -= temp;
      }
      if (offset < 0) {
        offset += temp;
        i--;
      }
      var year = i;
      var leap = leapMonth(year);
      var isLeap = false;
      for (i = 1; i <= 12 && offset > 0; i++) {
        if (leap > 0 && i === leap + 1 && !isLeap) {
          --i;
          isLeap = true;
          temp = leapDays(year);
        } else {
          temp = monthDays(year, i);
        }
        if (isLeap && i === leap + 1) isLeap = false;
        offset -= temp;
      }
      if (offset === 0 && leap > 0 && i === leap + 1) {
        if (isLeap) {
          isLeap = false;
        } else {
          isLeap = true;
          --i;
        }
      }
      if (offset < 0) {
        offset += temp;
        --i;
      }
      return { year: year, month: i, day: offset + 1, isLeap: isLeap };
    }

    function lunarText(date) {
      var y = date.getFullYear();
      if (y < 1900 || y > 2100) return '';
      var r = solarToLunar(y, date.getMonth() + 1, date.getDate());
      var yearName = STEMS.charAt((r.year - 4) % 10) + BRANCHES.charAt((r.year - 4) % 12) + '年';
      var monthName = (r.isLeap ? '闰' : '') + LUNAR_MONTHS.charAt(r.month - 1) + '月';
      return '农历' + yearName + monthName + LUNAR_DAYS[r.day - 1];
    }

    /* ---------------- 渲染 ---------------- */
    function gregorianText(date) {
      return date.getFullYear() + '年' + (date.getMonth() + 1) + '月' + date.getDate() + '日 ' +
        WEEKDAYS[date.getDay()];
    }

    function render(date) {
      var h = pad2(date.getHours());
      var m = pad2(date.getMinutes());
      var s = pad2(date.getSeconds());
      if (clockH.textContent !== h) clockH.textContent = h;
      if (clockM.textContent !== m) clockM.textContent = m;
      if (clockS.textContent !== s) clockS.textContent = s;

      var lunar = lunarText(date);
      var text = gregorianText(date) + (lunar ? ' · ' + lunar : '');
      if (dateLine.textContent !== text) dateLine.textContent = text;
    }

    function tick() {
      var now = Date.now() + clockOffset;
      var date = new Date(now);
      if (date.getSeconds() !== lastSecond) {
        lastSecond = date.getSeconds();
        render(date);
      }
      // 对齐到下一个整秒，避免累积误差
      window.setTimeout(tick, 1000 - (Date.now() % 1000) + 10);
    }

    /* ---------------- 网络校时 ---------------- */
    var TIMEOUT = 4000;

    function parseISO(value) {
      var s = String(value || '').trim();
      if (!s) return NaN;
      s = s.replace(/(\.\d{3})\d+/, '$1');
      if (!/[zZ]$|[+-]\d{2}:?\d{2}$/.test(s)) s += 'Z';
      return Date.parse(s);
    }

    function fetchJSON(url) {
      var controller = typeof AbortController === 'function' ? new AbortController() : null;
      var timer = window.setTimeout(function () {
        if (controller) controller.abort();
      }, TIMEOUT);

      return fetch(url, {
        cache: 'no-store',
        signal: controller ? controller.signal : undefined
      }).then(function (res) {
        if (!res.ok) throw new Error('HTTP ' + res.status);
        return res.json();
      }).then(function (data) {
        window.clearTimeout(timer);
        return data;
      }, function (err) {
        window.clearTimeout(timer);
        throw err;
      });
    }

    var SOURCES = [
      {
        name: 'timeapi.io',
        get: function () {
          return fetchJSON('https://timeapi.io/api/Time/current/zone?timeZone=Etc/UTC')
            .then(function (data) {
              var ms = parseISO(data && data.dateTime);
              if (!isFinite(ms)) throw new Error('返回数据无法解析');
              return ms;
            });
        }
      },
      {
        name: 'worldtimeapi.org',
        get: function () {
          return fetchJSON('https://worldtimeapi.org/api/timezone/Etc/UTC')
            .then(function (data) {
              var ms = parseISO(data && data.utc_datetime);
              if (!isFinite(ms)) ms = Number(data && data.unixtime) * 1000;
              if (!isFinite(ms)) throw new Error('返回数据无法解析');
              return ms;
            });
        }
      }
    ];

    function syncFrom(index) {
      if (index >= SOURCES.length) {
        console.warn('[时间] 时间 API 连接失败，已回退到系统时间显示。');
        return;
      }
      var source = SOURCES[index];
      var startedAt = Date.now();

      source.get().then(function (serverMs) {
        var receivedAt = Date.now();
        clockOffset = serverMs + (receivedAt - startedAt) / 2 - receivedAt;
        lastSecond = -1;
        render(new Date(receivedAt + clockOffset));
      }).catch(function (err) {
        console.warn('[时间] 时间源 ' + source.name + ' 连接失败：', err);
        syncFrom(index + 1);
      });
    }

    /* ---------------- 启动 ---------------- */
    render(new Date());
    tick();
    syncFrom(0);
  })();
</script>
</body>
</html>
